<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <!-- Anticaché: fuerza a que el navegador revalide el HTML shell en cada
       carga. Los assets JS/CSS que genera Vite ya llevan un hash en el
       nombre de archivo (p. ej. main-a1b2c3.js), así que cambian de URL
       solos en cada build y no necesitan esta cabecera — el problema real
       de caché suele ser este index.html quedándose desactualizado. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>MMO Espacial — Prototipo</title>
  <style>
    html, body { margin: 0; background: #05050a; overflow: hidden; touch-action: none; height: 100%; }
    canvas { touch-action: none; }
    #ui {
      position: fixed; top: 10px; left: 10px; color: #cfe8ff;
      font-family: monospace; font-size: clamp(11px, 2.6vw, 14px); z-index: 10;
      pointer-events: none;
    }

    /* --- Pantallas previas (patch notes + selección de personaje) --- */
    .overlay-screen {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column;
      background: #05050a; color: #cfe8ff;
      font-family: system-ui, sans-serif;
    }
    #intro-screen { visibility: hidden; }

    /* Pantalla 1: patch notes + barra de estado, ANCLADA ARRIBA */
    #intro-top-bar {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: clamp(8px, 2vw, 14px) clamp(12px, 3vw, 20px);
      border-bottom: 1px solid #223; background: #0a0e16;
    }
    #load-status {
      flex: 1; font-size: clamp(10px, 2.4vw, 12px); color: #7d93b0;
      font-family: monospace; line-height: 1.3;
    }
    #intro-continue-btn {
      padding: clamp(8px, 1.8vw, 10px) clamp(14px, 3vw, 18px);
      font-size: clamp(12px, 2.6vw, 14px); border-radius: 6px; border: none;
      background: #2a6fb0; color: #ffffff; cursor: pointer; white-space: nowrap;
      flex-shrink: 0;
    }
    #intro-continue-btn:active { background: #1f5686; }

    #intro-scroll {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: clamp(14px, 4vw, 24px) clamp(14px, 4vw, 20px);
    }
    #intro-scroll-inner { max-width: 640px; margin: 0 auto; }
    .patch-entry {
      margin-bottom: clamp(16px, 4vw, 24px); padding-bottom: clamp(12px, 3vw, 16px);
      border-bottom: 1px solid #16202c;
    }
    .patch-entry .patch-version {
      font-size: clamp(14px, 3.4vw, 17px); color: #ffffff; font-weight: 600; margin: 0 0 6px;
    }
    .patch-entry .patch-version .current-tag {
      font-size: clamp(9px, 2.2vw, 10px); color: #66ccff; border: 1px solid #66ccff;
      border-radius: 4px; padding: 1px 6px; margin-left: 8px; font-weight: 400;
      vertical-align: middle;
    }
    .patch-entry ul { margin: 4px 0; padding-left: 20px; }
    .patch-entry li {
      font-size: clamp(12px, 2.8vw, 14px); line-height: 1.5; color: #c3d6ea; margin: 3px 0;
    }

    /* Pantalla 2: selección/creación de personaje */
    #character-screen { align-items: center; justify-content: center; display: none; }
    #character-screen .char-box {
      display: flex; flex-direction: column; gap: clamp(8px, 2vw, 12px);
      width: min(360px, 88vw);
      max-height: 90vh; overflow-y: auto;
    }
    #character-screen h1 {
      font-size: clamp(16px, 4vw, 19px); margin: 0 0 4px; text-align: center; color: #ffffff;
    }
    .char-item {
      padding: clamp(10px, 2.4vw, 12px) clamp(12px, 2.8vw, 14px); border-radius: 6px;
      border: 1px solid #334455; background: #0a0e16; color: #cfe8ff;
      font-size: clamp(13px, 3vw, 15px); text-align: left; cursor: pointer;
    }
    .char-item:active { background: #141a24; }
    .char-item .char-meta { font-size: clamp(10px, 2.2vw, 11px); color: #7d93b0; margin-top: 2px; }
    #char-create-toggle-btn, #char-create-btn {
      padding: clamp(9px, 2.2vw, 10px) 12px; font-size: clamp(13px, 3vw, 14px);
      border-radius: 6px; border: none; background: #2a6fb0; color: #ffffff; cursor: pointer;
    }
    #char-create-toggle-btn:active, #char-create-btn:active { background: #1f5686; }
    #char-name-input {
      padding: clamp(9px, 2.2vw, 10px) 12px; font-size: clamp(14px, 3.4vw, 16px);
      border-radius: 6px; border: 1px solid #334455; background: #0a0e16; color: #cfe8ff;
    }
    #char-limit-msg { font-size: clamp(12px, 2.8vw, 13px); color: #d09a5a; text-align: center; }
    #char-status {
      font-size: clamp(10px, 2.2vw, 11px); color: #7d93b0; font-family: monospace; text-align: center;
    }

    @media (min-width: 900px) {
      #character-screen .char-box { width: min(400px, 60vw); }
    }

    /* --- Interfaz de juego en HTML (no Phaser) — botones, menú, versión.
       Solo el "mundo" (naves, asteroides, estrellas, estela, joystick)
       vive dentro del canvas; lo que es interfaz pura se renderiza como
       HTML normal, que el navegador ya sabe pintar nítido en cualquier
       pantalla sin necesidad de configurar nada. --- */
    #game-hud {
      position: fixed; inset: 0; z-index: 15; pointer-events: none;
      display: none; /* se muestra solo cuando el juego arranca */
    }
    #version-badge {
      position: absolute; top: 10px; right: 10px;
      font-family: monospace; font-size: clamp(10px, 2.4vw, 12px);
      color: #7d93b0;
    }
    #options-gear-btn {
      position: absolute; right: 20px; bottom: 150px; pointer-events: auto;
      width: clamp(44px, 10vw, 52px); height: clamp(44px, 10vw, 52px);
      border-radius: 8px; border: none; background: #141a24; color: #cfe8ff;
      font-size: clamp(18px, 4.5vw, 22px); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #options-gear-btn:active { background: #1c2534; }
    #action-buttons {
      position: absolute; right: 20px; bottom: 20px; pointer-events: none;
      display: flex; gap: 16px;
    }
    .hud-round-btn {
      pointer-events: auto;
      width: clamp(72px, 20vw, 92px); height: clamp(72px, 20vw, 92px);
      border-radius: 50%; border: 2px solid; cursor: pointer;
      font-family: monospace; font-size: clamp(11px, 2.8vw, 13px);
      color: #ffffff; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #mine-btn { background: rgba(255, 102, 68, 0.3); border-color: rgba(255, 102, 68, 0.8); }
    #warp-btn { background: rgba(51, 204, 102, 0.3); border-color: rgba(51, 204, 102, 0.8); }
    #warp-btn.charging { background: rgba(208, 160, 48, 0.3); border-color: rgba(208, 160, 48, 0.8); }
    #warp-btn.warping { background: rgba(51, 153, 255, 0.3); border-color: rgba(51, 153, 255, 0.8); }
    #warp-btn.cooldown { background: rgba(85, 85, 85, 0.3); border-color: rgba(85, 85, 85, 0.8); }

    /* Panel de opciones */
    #options-panel {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55);
    }
    #options-panel .panel-box {
      background: #0a0e16; border: 1px solid #334455; border-radius: 8px;
      padding: 20px; width: min(280px, 85vw); position: relative;
      color: #cfe8ff; font-family: system-ui, sans-serif;
    }
    #options-panel h2 { font-size: 15px; margin: 0 0 2px; color: #cfe8ff; }
    #options-panel .panel-version { font-size: 11px; color: #7d93b0; margin-bottom: 14px; }
    #options-panel .panel-section-label { font-size: 11px; color: #7d93b0; margin-bottom: 6px; }
    .lang-option {
      display: block; width: 100%; text-align: left; padding: 8px 10px;
      margin-bottom: 4px; background: transparent; border: none;
      color: #cfe8ff; font-size: 13px; cursor: pointer; border-radius: 6px;
    }
    .lang-option.current { color: #66ccff; }
    .lang-option:active { background: #141a24; }
    #options-close-dismiss {
      position: absolute; top: 10px; right: 12px; background: none; border: none;
      color: #889; font-size: 16px; cursor: pointer;
    }
    #close-game-btn {
      width: 100%; margin-top: 16px; padding: 10px; border-radius: 6px; border: none;
      background: #883333; color: #ffffff; font-size: 14px; cursor: pointer;
    }
    #close-game-btn:active { background: #6e2828; }

    /* Pantalla de "juego cerrado" */
    #game-closed-overlay {
      position: fixed; inset: 0; z-index: 50; display: none;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.92); color: #cfe8ff;
      font-family: system-ui, sans-serif; font-size: 16px; text-align: center;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="intro-screen" class="overlay-screen">
    <div id="intro-top-bar">
      <div id="load-status">Comprobando estado del servidor…</div>
      <button id="intro-continue-btn">Continuar</button>
    </div>
    <div id="intro-scroll"><div id="intro-scroll-inner"></div></div>
  </div>

  <div id="character-screen" class="overlay-screen">
    <div class="char-box">
      <h1 id="char-title">Elige tu piloto</h1>
      <div id="char-list"></div>
      <div id="char-create">
        <input id="char-name-input" type="text" maxlength="16" placeholder="Nombre del piloto" autocomplete="off" />
        <button id="char-create-btn">Crear personaje</button>
      </div>
      <button id="char-create-toggle-btn">+ Crear nuevo personaje</button>
      <div id="char-limit-msg" style="display:none;">Límite de 5 personajes alcanzado.</div>
      <div id="char-status"></div>
    </div>
  </div>

  <div id="game-hud">
    <div id="version-badge"></div>
    <button id="options-gear-btn">⚙</button>
    <div id="action-buttons">
      <button id="warp-btn" class="hud-round-btn"></button>
      <button id="mine-btn" class="hud-round-btn"></button>
    </div>
  </div>

  <div id="options-panel">
    <div class="panel-box">
      <button id="options-close-dismiss">✕</button>
      <h2 id="options-title">Opciones</h2>
      <div class="panel-version" id="options-version"></div>
      <div class="panel-section-label" id="options-lang-label">Idioma</div>
      <div id="lang-options"></div>
      <button id="close-game-btn">Cerrar juego</button>
    </div>
  </div>

  <div id="game-closed-overlay"></div>

  <div id="ui">Conectando…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
