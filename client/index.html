<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Anticaché: fuerza a que el navegador revalide el HTML shell en cada
       carga. Los assets JS/CSS que genera Vite ya llevan un hash en el
       nombre de archivo (p. ej. main-a1b2c3.js), así que cambian de URL
       solos en cada build y no necesitan esta cabecera — el problema real
       de caché suele ser este index.html quedándose desactualizado. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>MMO Espacial — Prototipo</title>
  <style>
    html, body { margin: 0; background: #05050a; overflow: hidden; touch-action: none; }
    canvas { touch-action: none; }
    #ui {
      position: fixed; top: 10px; left: 10px; color: #cfe8ff;
      font-family: monospace; font-size: 14px; z-index: 10;
      pointer-events: none;
    }

    /* --- Pantallas previas (changelog + selección de personaje) --- */
    .overlay-screen {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column;
      background: #05050a; color: #cfe8ff;
      font-family: system-ui, sans-serif;
    }

    /* Pantalla 1: changelog + barra de carga fija */
    #intro-scroll {
      flex: 1; overflow-y: auto; padding: 24px 20px 12px;
      -webkit-overflow-scrolling: touch;
    }
    #intro-scroll h1 { font-size: 20px; margin: 0 0 4px; color: #ffffff; }
    #intro-scroll h2 { font-size: 15px; margin: 20px 0 4px; color: #66ccff; }
    #intro-scroll h3 { font-size: 13px; margin: 10px 0 2px; color: #9fd0ee; }
    #intro-scroll p { font-size: 13px; line-height: 1.4; margin: 4px 0; color: #b8cbe0; }
    #intro-scroll ul { margin: 4px 0 10px; padding-left: 20px; }
    #intro-scroll li { font-size: 13px; line-height: 1.4; color: #b8cbe0; margin: 2px 0; }
    #intro-scroll strong { color: #e6f2ff; }

    /* Barra fija abajo — no se mueve con el scroll del changelog */
    #intro-bottom-bar {
      flex-shrink: 0; display: flex; align-items: center; gap: 14px;
      padding: 14px 20px; border-top: 1px solid #223; background: #0a0e16;
    }
    #load-status { flex: 1; font-size: 12px; color: #7d93b0; font-family: monospace; }
    #intro-continue-btn {
      padding: 10px 18px; font-size: 14px; border-radius: 6px; border: none;
      background: #2a6fb0; color: #ffffff; cursor: pointer; white-space: nowrap;
    }
    #intro-continue-btn:active { background: #1f5686; }

    /* Pantalla 2: selección/creación de personaje */
    #character-screen { align-items: center; justify-content: center; display: none; }
    #character-screen .char-box {
      display: flex; flex-direction: column; gap: 12px;
      width: min(320px, 85vw);
    }
    #character-screen h1 { font-size: 18px; margin: 0 0 4px; text-align: center; color: #ffffff; }
    .char-item {
      padding: 12px 14px; border-radius: 6px; border: 1px solid #334455;
      background: #0a0e16; color: #cfe8ff; font-size: 15px; text-align: left;
      cursor: pointer;
    }
    .char-item:active { background: #141a24; }
    .char-item .char-meta { font-size: 11px; color: #7d93b0; margin-top: 2px; }
    #char-create-toggle-btn, #char-create-btn {
      padding: 10px 12px; font-size: 14px; border-radius: 6px; border: none;
      background: #2a6fb0; color: #ffffff; cursor: pointer;
    }
    #char-create-toggle-btn:active, #char-create-btn:active { background: #1f5686; }
    #char-name-input {
      padding: 10px 12px; font-size: 16px; border-radius: 6px;
      border: 1px solid #334455; background: #0a0e16; color: #cfe8ff;
    }
    #char-limit-msg { font-size: 13px; color: #d09a5a; text-align: center; }
    #char-status { font-size: 11px; color: #7d93b0; font-family: monospace; text-align: center; }
  </style>
</head>
<body>
  <div id="intro-screen" class="overlay-screen">
    <div id="intro-scroll"></div>
    <div id="intro-bottom-bar">
      <div id="load-status">Comprobando estado del servidor…</div>
      <button id="intro-continue-btn">Continuar</button>
    </div>
  </div>

  <div id="character-screen" class="overlay-screen">
    <div class="char-box">
      <h1>Elige tu piloto</h1>
      <div id="char-list"></div>
      <div id="char-create">
        <input id="char-name-input" type="text" maxlength="16" placeholder="Nombre del piloto" autocomplete="off" />
        <button id="char-create-btn">Crear personaje</button>
      </div>
      <button id="char-create-toggle-btn">+ Crear nuevo personaje</button>
      <div id="char-limit-msg" style="display:none;">Límite de 5 personajes alcanzado.</div>
      <div id="char-status"></div>
    </div>
  </div>

  <div id="ui">Conectando…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
