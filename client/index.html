<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <!-- Anticaché: fuerza a que el navegador revalide el HTML shell en cada
       carga. Los assets JS/CSS que genera Vite ya llevan un hash en el
       nombre de archivo (p. ej. main-a1b2c3.js), así que cambian de URL
       solos en cada build y no necesitan esta cabecera — el problema real
       de caché suele ser este index.html quedándose desactualizado. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>MMO Espacial — Prototipo</title>
  <style>
    html, body { margin: 0; background: #05050a; overflow: hidden; touch-action: none; height: 100%; }
    canvas { touch-action: none; }
    #ui {
      position: fixed; top: 10px; left: 10px; color: #cfe8ff;
      font-family: monospace; font-size: clamp(11px, 2.6vw, 14px); z-index: 10;
      pointer-events: none;
    }
    /* Dato del HUD con su icono delante (carga, integridad del casco). */
    .hud-stat {
      display: inline-flex; align-items: center; gap: 4px;
      margin-right: 12px; vertical-align: middle;
    }
    .hud-stat .ui-icon { width: 1.15em; height: 1.15em; opacity: 0.85; }

    /* --- Pantallas previas (patch notes + selección de personaje) --- */
    .overlay-screen {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column;
      color: #cfe8ff;
      font-family: system-ui, sans-serif;
      /* Fondo del pack Wenrexa (bg-nebula.jpg, ya reducido a 960x540 —
         es una nebulosa desenfocada de fábrica, no pierde nada al
         achicarla). Un degradado oscuro por encima lo atenúa para que
         el texto siga leyéndose igual de bien que sobre negro plano —
         el fondo aporta ambiente, no debe competir con el contenido. */
      background:
        linear-gradient(180deg, rgba(5,6,10,0.88), rgba(5,6,10,0.94)),
        url("ui-pack/bg-nebula.jpg") center / cover no-repeat;
      background-color: #05050a; /* mientras carga la imagen */
    }
    #intro-screen { visibility: hidden; }
    /* BUG REAL: login-screen y character-screen heredaban display:flex de
       .overlay-screen sin ningún estado oculto por defecto (a diferencia
       de intro-screen). En el primer pintado, antes de que corra una sola
       línea de JS, ya se veían — con el texto en español escrito a mano
       en el HTML ("Entrar", "tu@correo.com"...). En cuanto termina
       loadTranslations() y detecta el idioma real del teléfono, ese texto
       se sustituye. Si el navegador del teléfono está en inglés, eso se
       ve como "empieza en español y cambia de golpe a inglés": no es un
       fallo de idioma, es que la pantalla se enseña antes de que la app
       decida cuál toca. Un selector por ID pesa más que la clase
       .overlay-screen, así que esto gana sin tocar el JS que ya
       alterna display "none"/"flex" en el momento correcto. */
    #login-screen { display: none; }

    /* --- Botones "sci-fi": esquinas cortadas en ángulo + brillo cian,
       inspirados en el pack de UI Wenrexa. Se usa clip-path (vectorial)
       en vez de los PNG de botón del pack tal cual: esos vienen a un
       ancho fijo, y con textos de longitud distinta por idioma (i18n)
       un botón raster estirado se ve borroso o deformado según el
       idioma. El color/brillo cian ya es el mismo que usa el resto del
       HUD (#66ccff — versión, joystick, retículas), así que el pack
       aporta la FORMA sin desentonar con lo que ya había. */
    .btn-scifi {
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      background: linear-gradient(135deg, #16232f, #0c131b);
      border: 1px solid rgba(102, 204, 255, 0.4);
      color: #cfe8ff;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .btn-scifi:active {
      background: linear-gradient(135deg, #1c3040, #101c26);
      border-color: rgba(102, 204, 255, 0.8);
    }
    .btn-scifi.btn-primary {
      background: linear-gradient(135deg, #1a4a7a, #10253d);
      border-color: rgba(102, 204, 255, 0.55);
      color: #ffffff;
    }
    .btn-scifi.btn-primary:active {
      background: linear-gradient(135deg, #1f5686, #163a5c);
    }
    .btn-scifi:disabled {
      background: #141a24; border-color: #263646; color: #5a6b80;
    }

    /* Pantalla 1: patch notes + barra de estado, ANCLADA ARRIBA */
    #intro-top-bar {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: clamp(8px, 2vw, 14px) clamp(12px, 3vw, 20px);
      border-bottom: 1px solid #223; background: #0a0e16;
    }
    #load-status {
      flex: 1; font-size: clamp(10px, 2.4vw, 12px); color: #7d93b0;
      font-family: monospace; line-height: 1.3;
    }
    #intro-continue-btn {
      padding: clamp(8px, 1.8vw, 10px) clamp(14px, 3vw, 18px);
      font-size: clamp(12px, 2.6vw, 14px); border: none;
      cursor: pointer; white-space: nowrap;
      flex-shrink: 0;
    }

    #intro-scroll {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: clamp(14px, 4vw, 24px) clamp(14px, 4vw, 20px);
    }
    #intro-scroll-inner { max-width: 640px; margin: 0 auto; }
    .patch-entry {
      margin-bottom: clamp(16px, 4vw, 24px); padding-bottom: clamp(12px, 3vw, 16px);
      border-bottom: 1px solid #16202c;
    }
    .patch-entry .patch-version {
      font-size: clamp(14px, 3.4vw, 17px); color: #ffffff; font-weight: 600; margin: 0 0 6px;
    }
    .patch-entry .patch-version .current-tag {
      font-size: clamp(9px, 2.2vw, 10px); color: #66ccff; border: 1px solid #66ccff;
      border-radius: 4px; padding: 1px 6px; margin-left: 8px; font-weight: 400;
      vertical-align: middle;
    }
    .patch-entry ul { margin: 4px 0; padding-left: 20px; }
    .patch-entry li {
      font-size: clamp(12px, 2.8vw, 14px); line-height: 1.5; color: #c3d6ea; margin: 3px 0;
    }

    /* La barra metálica del pack Wenrexa (panel-bar.png) como remate
       decorativo encima de la caja — la misma clase .char-box la usan
       login-screen Y character-screen, así que un solo ::before cubre
       las dos pantallas. Es solo decoración (no lleva texto ni pointer
       events), por eso vive en un pseudo-elemento y no complica el HTML. */
    .char-box {
      position: relative;
      padding-top: 14px;
    }
    .char-box::before {
      content: "";
      position: absolute; top: 0; left: 10%; right: 10%; height: 4px;
      background: url("ui-pack/panel-bar.png") center / cover no-repeat;
      opacity: 0.8;
    }

    /* Pantalla 2: selección/creación de personaje */
    #character-screen { align-items: center; justify-content: center; display: none; }
    #character-screen .char-box {
      display: flex; flex-direction: column; gap: clamp(8px, 2vw, 12px);
      width: min(360px, 88vw);
      max-height: 90vh; overflow-y: auto;
    }
    #character-screen h1 {
      font-size: clamp(16px, 4vw, 19px); margin: 0 0 4px; text-align: center; color: #ffffff;
    }
    .char-item {
      padding: clamp(10px, 2.4vw, 12px) clamp(12px, 2.8vw, 14px); border-radius: 6px;
      border: 1px solid #334455; background: #0a0e16; color: #cfe8ff;
      font-size: clamp(13px, 3vw, 15px); text-align: left; cursor: pointer;
    }
    .char-item:active { background: #141a24; }
    .char-item .char-meta { font-size: clamp(10px, 2.2vw, 11px); color: #7d93b0; margin-top: 2px; }
    #char-create-toggle-btn, #char-create-btn {
      padding: clamp(9px, 2.2vw, 10px) 12px; font-size: clamp(13px, 3vw, 14px);
      border: none; cursor: pointer;
    }
    #login-explain {
      color: #8fa6c4; font-size: clamp(12px, 2.8vw, 14px);
      line-height: 1.5; margin: 0 0 16px;
    }
    #login-email-input, #login-password-input {
      width: 100%; box-sizing: border-box; padding: 12px;
      background: #0d131c; border: 1px solid #2a3a52; border-radius: 8px;
      color: #cfe8ff; font-family: monospace; font-size: clamp(13px, 3vw, 15px);
      margin-bottom: 12px;
    }
    #login-signin-btn, #login-signup-btn {
      width: 100%; padding: 12px;
      font-family: monospace; font-size: clamp(13px, 3vw, 15px);
      cursor: pointer; margin-bottom: 10px;
    }
    #login-status {
      margin-top: 14px; color: #8fa6c4; font-size: clamp(11px, 2.6vw, 13px);
      line-height: 1.5; min-height: 1.2em;
    }
    /* Botón de borrar personaje, a la derecha de cada uno de la lista. */
    .char-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 8px; }
    .char-row .char-item { flex: 1; margin-bottom: 0; }
    .char-delete-btn {
      width: 44px; flex-shrink: 0; border-radius: 8px; cursor: pointer;
      background: #2a1418; border: 1px solid #5a2530; color: #d98a95;
      font-family: monospace; font-size: 16px;
    }
    .char-delete-btn:active { background: #3a1c22; }
    #char-signout-btn {
      margin-top: 18px; background: none; border: none; cursor: pointer;
      color: #6b7d92; font-family: monospace;
      font-size: clamp(11px, 2.5vw, 12px); text-decoration: underline;
    }
    #char-name-input {
      padding: clamp(9px, 2.2vw, 10px) 12px; font-size: clamp(14px, 3.4vw, 16px);
      border-radius: 6px; border: 1px solid #334455; background: #0a0e16; color: #cfe8ff;
    }
    #char-limit-msg { font-size: clamp(12px, 2.8vw, 13px); color: #d09a5a; text-align: center; }
    #char-status {
      font-size: clamp(10px, 2.2vw, 11px); color: #7d93b0; font-family: monospace; text-align: center;
    }

    @media (min-width: 900px) {
      #character-screen .char-box { width: min(400px, 60vw); }
    }

    /* --- Interfaz de juego en HTML (no Phaser) — botones, menú, versión.
       Solo el "mundo" (naves, asteroides, estrellas, estela, joystick)
       vive dentro del canvas; lo que es interfaz pura se renderiza como
       HTML normal, que el navegador ya sabe pintar nítido en cualquier
       pantalla sin necesidad de configurar nada. --- */
    #game-hud {
      position: fixed; inset: 0; z-index: 15; pointer-events: none;
      display: none; /* se muestra solo cuando el juego arranca */
    }
    #version-badge {
      position: absolute; top: 64px; right: 10px;
      font-family: monospace; font-size: clamp(10px, 2.4vw, 12px);
      color: #7d93b0;
    }
    #options-gear-btn {
      position: absolute; top: 10px; right: 10px; pointer-events: auto;
      width: clamp(44px, 10vw, 52px); height: clamp(44px, 10vw, 52px);
      border-radius: 8px; border: 1px solid rgba(102, 204, 255, 0.35);
      cursor: pointer;
      background: url("ui-pack/icon-settings.png") center / cover no-repeat, #141a24;
    }
    #options-gear-btn:active { border-color: rgba(102, 204, 255, 0.7); }
    /* --- Iconos de interfaz --------------------------------------------
       Los iconos viven en UNA sola imagen (ui/icons.png, rejilla 4 cols
       × 6 filas desde v0.5.12 — antes 4×4; quedan 3 huecos libres al
       final para futuros iconos). Una descarga en vez de veintiuna: en
       móvil con conexión lenta esa es la diferencia entre ver el HUD al
       instante o verlo aparecer a trozos.

       No se pinta la imagen: se usa como MÁSCARA (mask). La imagen dice
       "qué forma tiene el icono" y el color lo pone `background-color`,
       heredado del texto del botón. Así el mismo dibujo de nave sirve
       para verde (amigo), rojo (enemigo) o gris (apagado) sin guardar
       tres imágenes distintas.

       --ix / --iy son la columna (0 a 3) y fila (0 a 5) del icono dentro
       de la rejilla. La URL la inyecta main.js, porque el juego se
       publica en un subdirectorio y ahí la ruta correcta solo se conoce
       en JS. mask-size es (nº columnas)×100% por (nº filas)×100%; el
       paso de mask-position es 100/(columnas-1)% en X y 100/(filas-1)%
       en Y — si la rejilla vuelve a crecer, estos tres números son los
       que hay que tocar (4/6/33.3333/20), nada más. */
    .ui-icon {
      display: block;
      width: 100%; height: 100%;
      background-color: currentColor;
      -webkit-mask-image: var(--icons-url); mask-image: var(--icons-url);
      -webkit-mask-size: 400% 600%; mask-size: 400% 600%;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: calc(var(--ix) * 33.3333%) calc(var(--iy) * 20%);
      mask-position: calc(var(--ix) * 33.3333%) calc(var(--iy) * 20%);
    }

    /* Fila de la casilla "mantener sesion". El <label> envuelve casilla y
       texto para que se pueda pulsar en cualquiera de los dos: en movil,
       acertar solo en la casilla es incomodo. */
    #login-remember-row {
      display: flex; align-items: center; gap: 8px;
      font-family: monospace; font-size: clamp(11px, 2.6vw, 13px);
      color: #9fb8d4; cursor: pointer; margin: 2px 0 6px;
      -webkit-tap-highlight-color: transparent;
    }
    #login-remember { width: 18px; height: 18px; accent-color: #3399ff; flex-shrink: 0; }

    /* --- Barras de combate: escudo, estructura, energia ------------------
       Tres barras finas debajo del contador de arriba. Colores distintos
       para que se distingan sin leer texto: verde escudo, gris estructura,
       azul energia. Cuando el escudo llega a 0 la barra de estructura pasa
       a rojo, para que el peligro se note sin tener que mirar el numero. */
    #combat-bars {
      position: fixed; top: 46px; left: 10px; z-index: 10;
      display: flex; flex-direction: column; gap: 4px;
      width: clamp(120px, 34vw, 180px);
      pointer-events: none;
    }
    /* Icono + barra en fila — el icono da contexto sin tener que leer el
       color (útil para quien no distinga bien azul/gris/amarillo). Se
       tiñe con el mismo color que su barra vía `color` (el icono es una
       máscara, hereda currentColor). */
    .cbar-row { display: flex; align-items: center; gap: 5px; }
    .cbar-icon { width: 12px; height: 12px; flex-shrink: 0; opacity: 0.9; }
    .cbar-track {
      flex: 1;
      height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12);
      overflow: hidden;
    }
    .cbar-fill { height: 100%; border-radius: 3px; transition: width 150ms linear; }
    #shield-fill { background: #46c8ff; }
    #structure-fill { background: #9fb0c0; }
    #structure-fill.critical { background: #ff5555; }
    #capacitor-fill { background: #ffcc44; }

    /* --- Indicador de piloto crucero (8.4.10.3) -----------------------
       Sin esto, activar el crucero no tenía NINGÚN reflejo visual — el
       jugador solo lo sabía por tacto (la nave seguía moviéndose sola).
       Arriba centrado, aparece/desaparece según player.cruising; no
       lleva pointer-events porque es solo informativo, no interactivo. */
    #cruise-indicator {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: none; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px;
      background: rgba(10, 20, 30, 0.75); border: 1px solid rgba(102, 204, 255, 0.45);
      color: #66ccff; font-family: monospace; font-size: clamp(11px, 2.6vw, 13px);
      pointer-events: none; white-space: nowrap;
    }
    #cruise-indicator .ui-icon { width: 16px; height: 16px; flex-shrink: 0; }

    /* --- Boton de disparo y casilla de autodisparo -------------------------
       Van pegados al boton de accion, en el mismo lado (pulgar derecho).
       Solo existen con un objetivo FIJADO Y BLOQUEADO (15.4.1): sin eso no
       hay nada que disparar, asi que no ocupan sitio en pantalla. */
    #combat-buttons {
      position: absolute; right: 20px; bottom: 128px; pointer-events: none;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    }
    #combat-buttons.empty { display: none; }
    #fire-btn {
      pointer-events: auto;
      width: clamp(60px, 16vw, 76px); height: clamp(60px, 16vw, 76px);
      border-radius: 50%; border: 2px solid rgba(255, 80, 80, 0.8);
      background: rgba(255, 80, 80, 0.22);
      color: #fff; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #fire-btn.active { background: rgba(255, 80, 80, 0.55); }
    #fire-btn.no-energy { opacity: 0.4; }
    #fire-btn .ui-icon { width: 44%; height: 44%; }
    #autoshoot-row {
      pointer-events: auto; display: flex; align-items: center; gap: 6px;
      background: rgba(10,14,22,0.6); border-radius: 12px; padding: 4px 10px;
      font-family: monospace; font-size: clamp(9px, 2.2vw, 11px); color: #cfe0f0;
    }
    #autoshoot-check { width: 15px; height: 15px; accent-color: #ff5050; }

    /* --- Marcador de objetivo: barra de fijado sobre el HUD, no en el mundo.
       La reticula girando ya existe en el mundo (Phaser); esta barra es el
       resumen textual encima, con nombre y las dos capas de vida. */
    #target-panel {
      position: fixed; top: 10px; right: 10px; z-index: 10;
      width: clamp(130px, 38vw, 190px);
      background: rgba(10,14,22,0.55); border-radius: 8px; padding: 6px 8px;
      font-family: monospace; color: #dfe8f2; pointer-events: none;
      display: none;
    }
    #target-panel.visible { display: block; }
    #target-name { font-size: clamp(10px, 2.6vw, 12px); margin-bottom: 4px; }
    #target-bars .cbar-track { height: 5px; margin-bottom: 3px; }
    #target-shield-fill { background: #46c8ff; }
    #target-structure-fill { background: #9fb0c0; }

    #action-buttons {
      position: absolute; right: 20px; bottom: 20px; pointer-events: none;
      display: flex; gap: 16px; align-items: flex-end;
    }
    .hud-round-btn {
      pointer-events: auto; position: relative;
      width: clamp(72px, 20vw, 92px); height: clamp(72px, 20vw, 92px);
      border-radius: 50%; border: 2px solid; cursor: pointer;
      color: #ffffff; padding: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 120ms linear, transform 80ms linear;
    }
    .hud-round-btn:active { transform: scale(0.94); }
    .hud-round-btn .ui-icon { width: 46%; height: 46%; flex-shrink: 0; }
    .hud-round-btn .btn-label {
      font-family: monospace; font-size: clamp(8px, 2.1vw, 10px);
      letter-spacing: 0.5px; line-height: 1; opacity: 0.85;
    }

    /* El botón de acción es uno solo y cambia de significado según lo que
       tengas a rango. Cuando no hay nada accionable no se queda ahí
       apagado ocupando sitio: desaparece y deja de recibir toques. */
    #action-btn { background: rgba(255, 102, 68, 0.3); border-color: rgba(255, 102, 68, 0.8); }
    #action-btn.empty { opacity: 0; pointer-events: none; }
    #action-btn.kind-dock { background: rgba(80, 160, 255, 0.3); border-color: rgba(80, 160, 255, 0.8); }
    #action-btn.kind-gate { background: rgba(170, 120, 255, 0.3); border-color: rgba(170, 120, 255, 0.8); }
    #action-btn.kind-loot { background: rgba(230, 190, 90, 0.3); border-color: rgba(230, 190, 90, 0.8); }

    #warp-btn { background: rgba(51, 204, 102, 0.3); border-color: rgba(51, 204, 102, 0.8); }
    #warp-btn.charging { background: rgba(208, 160, 48, 0.3); border-color: rgba(208, 160, 48, 0.8); }
    #warp-btn.warping { background: rgba(51, 153, 255, 0.3); border-color: rgba(51, 153, 255, 0.8); }
    #warp-btn.cooldown { background: rgba(85, 85, 85, 0.3); border-color: rgba(85, 85, 85, 0.8); }

    /* Panel de opciones */
    #options-panel {
      position: fixed; inset: 0; z-index: 40; display: none;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55);
    }
    #options-panel .panel-box {
      background: #0a0e16; border: 1px solid #334455; border-radius: 8px;
      padding: 20px; width: min(280px, 85vw); position: relative;
      color: #cfe8ff; font-family: system-ui, sans-serif;
    }
    #options-panel h2 { font-size: 15px; margin: 0 0 2px; color: #cfe8ff; }
    #options-panel .panel-version { font-size: 11px; color: #7d93b0; margin-bottom: 14px; }
    #options-panel .panel-section-label { font-size: 11px; color: #7d93b0; margin-bottom: 6px; }
    .lang-option {
      display: block; width: 100%; text-align: left; padding: 8px 10px;
      margin-bottom: 4px; background: transparent; border: none;
      color: #cfe8ff; font-size: 13px; cursor: pointer; border-radius: 6px;
    }
    .lang-option.current { color: #66ccff; }
    .lang-option:active { background: #141a24; }
    .options-check-row {
      display: flex; align-items: center; gap: 8px; margin-top: 16px;
      padding-top: 14px; border-top: 1px solid #223; font-size: 12px;
      color: #cfe8ff; cursor: pointer;
    }
    .options-check-row input { width: 16px; height: 16px; accent-color: #66ccff; flex-shrink: 0; }
    #options-close-dismiss {
      position: absolute; top: 10px; right: 12px; background: none; border: none;
      color: #889; font-size: 16px; cursor: pointer;
    }
    #close-game-btn {
      width: 100%; margin-top: 16px; padding: 10px; border-radius: 6px; border: none;
      background: #883333; color: #ffffff; font-size: 14px; cursor: pointer;
    }
    #close-game-btn:active { background: #6e2828; }

    /* Pantalla de "juego cerrado" */
    #game-closed-overlay {
      position: fixed; inset: 0; z-index: 50; display: none;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.92); color: #cfe8ff;
      font-family: system-ui, sans-serif; font-size: 16px; text-align: center;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="intro-screen" class="overlay-screen">
    <div id="intro-top-bar">
      <div id="load-status">Comprobando estado del servidor…</div>
      <button id="intro-continue-btn" class="btn-scifi btn-primary">Continuar</button>
    </div>
    <div id="intro-scroll"><div id="intro-scroll-inner"></div></div>
  </div>

  <div id="login-screen" class="overlay-screen">
    <div class="char-box">
      <h1 id="login-title">Entrar</h1>
      <input id="login-email-input" type="email" inputmode="email" autocomplete="username" placeholder="tu@correo.com" />
      <input id="login-password-input" type="password" autocomplete="current-password" placeholder="Contraseña" />
      <label id="login-remember-row">
        <input id="login-remember" type="checkbox" checked />
        <span id="login-remember-label">Mantener sesión iniciada</span>
      </label>
      <button id="login-signin-btn" class="btn-scifi btn-primary">Entrar</button>
      <button id="login-signup-btn" class="btn-scifi">Crear cuenta</button>
      <div id="login-status"></div>
    </div>
  </div>

  <div id="character-screen" class="overlay-screen">
    <div class="char-box">
      <h1 id="char-title">Elige tu piloto</h1>
      <div id="char-list"></div>
      <div id="char-create">
        <input id="char-name-input" type="text" maxlength="16" placeholder="Nombre del piloto" autocomplete="off" />
        <button id="char-create-btn" class="btn-scifi btn-primary">Crear personaje</button>
      </div>
      <button id="char-create-toggle-btn" class="btn-scifi">+ Crear nuevo personaje</button>
      <div id="char-limit-msg" style="display:none;">Límite de 5 personajes alcanzado.</div>
      <div id="char-status"></div>
      <button id="char-signout-btn">Cerrar sesión</button>
    </div>
  </div>

  <div id="game-hud">
    <div id="version-badge"></div>
    <button id="options-gear-btn" aria-label="Opciones"></button>
    <div id="combat-bars">
      <div class="cbar-row">
        <i class="ui-icon cbar-icon" style="--ix:0; --iy:4; color:#46c8ff;"></i>
        <div class="cbar-track"><div id="shield-fill" class="cbar-fill" style="width:100%"></div></div>
      </div>
      <div class="cbar-row">
        <i class="ui-icon cbar-icon" style="--ix:1; --iy:4; color:#9fb0c0;"></i>
        <div class="cbar-track"><div id="structure-fill" class="cbar-fill" style="width:100%"></div></div>
      </div>
      <div class="cbar-row">
        <i class="ui-icon cbar-icon" style="--ix:2; --iy:4; color:#ffcc44;"></i>
        <div class="cbar-track"><div id="capacitor-fill" class="cbar-fill" style="width:100%"></div></div>
      </div>
    </div>

    <div id="target-panel">
      <div id="target-name"></div>
      <div id="target-bars">
        <div class="cbar-row">
          <i class="ui-icon cbar-icon" style="--ix:0; --iy:4; color:#46c8ff;"></i>
          <div class="cbar-track"><div id="target-shield-fill" class="cbar-fill" style="width:100%"></div></div>
        </div>
        <div class="cbar-row">
          <i class="ui-icon cbar-icon" style="--ix:1; --iy:4; color:#9fb0c0;"></i>
          <div class="cbar-track"><div id="target-structure-fill" class="cbar-fill" style="width:100%"></div></div>
        </div>
      </div>
    </div>

    <div id="combat-buttons" class="empty">
      <label id="autoshoot-row">
        <input id="autoshoot-check" type="checkbox" />
        <span id="autoshoot-label">Auto</span>
      </label>
      <button id="fire-btn">
        <i class="ui-icon" style="--ix:3; --iy:1;"></i>
      </button>
    </div>

    <div id="action-buttons">
      <button id="warp-btn" class="hud-round-btn">
        <i class="ui-icon" style="--ix:0; --iy:0;"></i>
        <span class="btn-label"></span>
      </button>
      <button id="action-btn" class="hud-round-btn empty">
        <i class="ui-icon" style="--ix:2; --iy:1;"></i>
        <span class="btn-label"></span>
      </button>
    </div>
  </div>

  <div id="options-panel">
    <div class="panel-box">
      <button id="options-close-dismiss">✕</button>
      <h2 id="options-title">Opciones</h2>
      <div class="panel-version" id="options-version"></div>
      <div class="panel-section-label" id="options-lang-label">Idioma</div>
      <div id="lang-options"></div>
      <label id="autotarget-back-row" class="options-check-row">
        <input id="autotarget-back-check" type="checkbox" checked />
        <span id="autotarget-back-label"></span>
      </label>
      <button id="close-game-btn">Cerrar juego</button>
    </div>
  </div>

  <div id="game-closed-overlay"></div>

  <div id="ui">Conectando…</div>
  <div id="cruise-indicator">
    <i class="ui-icon" style="--ix:3; --iy:4;"></i>
    <span id="cruise-indicator-label">Piloto crucero activado</span>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
